name: Deploy to Cloudflare

# Auto-deploys every push to schedule-and-auth-5.24 (the active dev branch)
# and master. Also exposes a manual trigger so a teacher / Tim can
# redeploy without pushing (Actions tab → "Deploy to Cloudflare" → Run
# workflow).
#
# Secrets required (set at https://github.com/timjmills/mycurricula.app/settings/secrets/actions):
#   • CLOUDFLARE_API_TOKEN          — User API Token with Workers Scripts:Edit,
#                                     Account:Read, Workers R2 Storage:Edit
#   • CLOUDFLARE_ACCOUNT_ID         — 009d3815b362e176031f124202abbcf9
#   • NEXT_PUBLIC_SUPABASE_URL      — https://xuukfpvonsbvvbspsrsl.supabase.co
#   • NEXT_PUBLIC_SUPABASE_ANON_KEY — Public anon key from Supabase dashboard
#   • NEXT_PUBLIC_GOOGLE_CLIENT_ID  — Google OAuth Web client ID
#                                     (…apps.googleusercontent.com). Baked into
#                                     the bundle at build time; without it the
#                                     login page shows "Google sign-in isn't
#                                     configured yet".
#   • NEXT_PUBLIC_TEACH_USE_SUPABASE   — "1" to persist Teach boards to Postgres
#                                        (optional; omit/empty = mock).
#   • NEXT_PUBLIC_PLANNER_USE_SUPABASE — "1" to persist lessons/units/resources
#                                        (optional; omit/empty = mock).
#   • NEXT_PUBLIC_THEME_SYNC           — "1" to mirror theme/style/palette to
#                                        the teacher_preferences table for
#                                        cross-device sync (optional; omit/
#                                        empty = localStorage only).
#
# Worker runtime secrets (R2_*, SUPABASE_SERVICE_ROLE_KEY, CLAUDE_BYPASS_TOKEN)
# are already set on the Worker via `wrangler secret put` and the deploy
# does NOT re-set them — they live in the Worker's runtime environment.

on:
  push:
    branches:
      - master
  workflow_dispatch:

# QUEUE deploys; never cancel one. `cancel-in-progress: true` is right for a
# preview branch and wrong for an auto-deploying production branch, because it
# converts push pressure into DEPLOY STARVATION — silently.
#
# Observed 2026-07-25: a deploy takes ~2.5 min and master was taking a push
# every ~2-3 min during an agent-team session. Every push killed the running
# build, so the pipeline could only land a commit during a >=3-minute gap in
# pushes. Seven consecutive runs: one success, six cancelled. Production sat
# frozen on an hours-old commit for ~20 minutes while `master` moved eight
# commits ahead — and nothing failed, nothing alerted. A cancelled run is a
# grey tick, not a red one, so the dashboard looked fine.
#
# With `false`, deploys serialise instead. Each one deploys a superset of the
# last, so a burst costs some redundant build minutes and then drains. That is
# a far better failure mode than prod quietly ceasing to move: slow and correct
# beats fast and stalled.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          # Wrangler 4.x requires Node ≥ 22. Wrangler 3 ran on 20 but the
          # `opennextjs-cloudflare` toolchain we use is tied to Wrangler 4.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ── Test gate (audit finding #25) ──────────────────────────────────
      # Lint, typecheck, and unit tests run BEFORE the build/deploy step so a
      # red gate blocks the deploy. Any non-zero exit here fails the job and
      # the "Build + deploy" step never runs.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm run test

      # `deploy:cf` runs `opennextjs-cloudflare build && opennextjs-cloudflare
      # deploy` so this single step covers both the build + deploy.
      - name: Build + deploy to Cloudflare
        run: npm run deploy:cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # NEXT_PUBLIC_* values are inlined by `next build`, so they MUST be
          # present here (in CI), not just on the Cloudflare Worker. Empty/unset
          # falls back to the safe default (login shows "not configured" /
          # planner+teach stay on mock).
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_TEACH_USE_SUPABASE: ${{ secrets.NEXT_PUBLIC_TEACH_USE_SUPABASE }}
          NEXT_PUBLIC_PLANNER_USE_SUPABASE: ${{ secrets.NEXT_PUBLIC_PLANNER_USE_SUPABASE }}
          NEXT_PUBLIC_THEME_SYNC: ${{ secrets.NEXT_PUBLIC_THEME_SYNC }}
          # Multi-workspace tenancy (unified plan §0 enable cutover, 2026-07-24).
          # Build-inlined like the rest; sourced from a repository variable so a
          # rollback is "flip the variable + re-run" (a redeploy), not a commit.
          # Unset/empty = OFF (the pre-cutover flag-OFF build).
          NEXT_PUBLIC_MULTI_WORKSPACE: ${{ vars.NEXT_PUBLIC_MULTI_WORKSPACE || '' }}
          # v2 redesign shell/router gate (plan §0.1). INLINED into the artifact
          # by `next build`, so a rollback is a REBUILD — a Worker env change has
          # no effect. Sourced from a repository variable so a flip is "change the
          # variable + re-run this workflow" (a redeploy), NOT a code commit
          # (§4a M2). Defaults to "1" if the variable is unset.
          #
          # "0" BUILDS AND SHIPS as of 2026-08-10 — but it is a PARTIAL
          # fallback, not a faithful v1 restore. Read both halves before
          # relying on it in an incident.
          #
          # It builds: an earlier version of this note said "0" was "currently
          # rejected by scripts/check-v2-flag.mjs until the router gates land".
          # The gates landed, lib/v2-flag.ts sets V2_ROUTER_GATED = true, and
          # that script's die() is guarded by `RAW === "0" && !routerGated`, so
          # it no longer fires. That stale note was worse than a broken lever —
          # an operator reading it under pressure would conclude rollback was
          # disabled and never attempt it.
          #
          # It is NOT faithful: NOTHING assigns `documentElement.dataset.style`
          # anywhere in the codebase, under either flag state, while
          # app/tokens.css:1646-1656 still carries three `:root[data-style=…]`
          # rules that v1 styling depends on. So a flag-OFF deploy restores the
          # v1 chrome and route canvases WITHOUT the v1 style axis — a hybrid.
          # Do not describe this as "restoring production v1"; it gets you a
          # v1-shaped build with a missing axis, which is a different thing to
          # be debugging at 2am.
          #
          # ⚠ THIS LEVER DIES WITH THE v1 DELETION (task #7). Once the v1 route
          # canvases are gone there is nothing for "0" to select, and rollback
          # becomes revert-the-merge + redeploy. Whoever lands that deletion must
          # update this comment and docs/7.16.26-cutover-readiness.md:63-70 in
          # the SAME commit — silently removing the documented rollback path is
          # the kind of omission that only surfaces during an incident.
          NEXT_PUBLIC_V2: ${{ vars.NEXT_PUBLIC_V2 || '1' }}

      - name: Summary
        if: always()
        run: |
          {
            echo "## Deploy ${{ job.status }}"
            echo ""
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Live: https://mycurricula.app"
          } >> "$GITHUB_STEP_SUMMARY"
